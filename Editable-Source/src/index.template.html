<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81502d"><meta name="description" content="Timber Strike. A wooden arcade game by Mint Play. Tap, aim your timing, and split the log."><title>Timber Strike · Mint Play</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2373482b'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%23d3a05b' stroke='%23986735' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23986735' stroke-width='3'/%3E%3C/svg%3E"><style>__CSS__</style></head>
<body><script type="text/plain" id="font-license">__FONT_LICENSE__</script><main id="game" aria-label="Timber Strike game">
<canvas id="field" role="img" aria-label="A spinning log. Tap the playfield or press Space to throw your weapon."></canvas>
<header class="topbar"><span class="brand">Mint Play</span><button id="soundToggle" class="icon-button sound-button" aria-label="Mute sound" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4z"/><path class="sound-wave" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/></svg></button><button id="pause" class="icon-button" aria-label="Pause game" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></svg></button></header>
<div id="hud" class="hud" hidden><div><span class="score-label">Score</span><span id="score" class="score-value">0</span></div><div class="level-block"><div id="level" class="level">Level 1</div><div id="remaining" class="remaining" aria-label="Arrows remaining"></div></div><div id="hearts" class="hearts" aria-label="3 hearts"></div></div>
<div id="title" class="title"><h1><span>Timber</span><span>Strike</span></h1><div class="rule"></div></div>
<div id="startControls" class="start-controls"><button id="play" class="wood-button"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>Play</button></div>
<footer id="footer" class="footer"><button id="workshopOpen" class="text-button"><svg viewBox="0 0 24 24"><path d="m14 4 6 6M16 2l6 6-4 4-6-6zM14 10 3 21l-1-1L13 9M2 5l3-3 15 15-3 3z"/></svg>Workshop</button><button id="fullscreen" class="text-button" aria-label="Enter full screen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m8 0h5v-5"/></svg></button></footer>
<div id="hint" class="throw-hint" hidden>Tap anywhere to throw</div>
<section id="pauseOverlay" class="overlay" hidden aria-label="Paused"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pauseTitle"><h2 id="pauseTitle">Paused</h2><button id="resume" class="wood-button">Keep playing</button><button id="pauseWorkshop" class="secondary">Workshop</button><button id="quit" class="text-button">Back to start</button></div></section>
<section id="gameOver" class="overlay result-overlay" hidden aria-label="Game over"><div class="dialog result-board" role="dialog" aria-modal="true" aria-labelledby="endTitle">
<div class="result-emblem" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="39" fill="#b78648" stroke="#644321" stroke-width="7"/><circle cx="50" cy="50" r="27" stroke="#8c5c2f" stroke-width="3"/><path d="m25 80 48-59m-8 6 8-6-1 11M75 80 27 21m8 6-8-6 1 11" stroke="#e5e4bd" stroke-width="5"/><path d="m22 78 7 6m42 0 7-6" stroke="#99b37c" stroke-width="8"/></svg></div>
<h2 id="endTitle" class="ribbon">Run over</h2><div class="score-medallion"><span class="result-label">Score</span><div id="endScore" class="result-score">0</div><span id="recordFlag" class="record-flag" hidden>New best</span></div>
<div class="run-details"><span>Level <strong id="endLevel">1</strong></span><span>Best <strong id="endBest">0</strong></span></div>
<button id="again" class="wood-button"><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>Play again</button>
<button id="revive" class="secondary revive-button"><svg viewBox="0 0 24 24"><path d="M12 21 3.6 12.5C-2 6.5 5.7-.5 12 5.6 18.3-.5 26 6.5 20.4 12.5z"/></svg><span>Revive</span><span class="free-label">Free</span></button>
<div class="result-tools"><button id="home" class="text-button"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>Home</button><button id="endWorkshop" class="text-button"><svg viewBox="0 0 24 24"><path d="m5 4 15 15m-1-15L4 19M3 4l3-1 2 3-3 2zM16 3l5 5M2 18l4 4"/></svg>Workshop</button></div>
</div></section>
<section id="workshop" class="workshop" hidden aria-label="Workshop"><div class="workshop-head"><div><h2>Workshop</h2><p id="workshopSub" class="workshop-sub">Best score 0</p></div><button id="workshopClose" class="icon-button" aria-label="Close workshop"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div id="weaponGrid" class="weapon-grid"></div></section>
<div id="notice" role="status"></div><span id="announcer" class="sr-only" aria-live="polite"></span><div id="loading" class="loading"><p>Timber Strike</p></div>
</main><script>window.TIMBER_ART={logs:"__LOGS__",moreLogs:"__MORE_LOGS__"};</script><script>__CORE__</script><script>__RENDER__</script><script>__STORAGE__</script><script>__SOUND__</script><script>__APP__</script></body></html>
