<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#81502d"><meta name="description" content="Timber Strike. A wooden arcade game by Mint Play. Tap, aim your timing, and split the log."><title>Timber Strike · Mint Play</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2373482b'/%3E%3Ccircle cx='32' cy='32' r='23' fill='%23d3a05b' stroke='%23986735' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%23986735' stroke-width='3'/%3E%3C/svg%3E"><style>__CSS__</style></head>
<body><script type="text/plain" id="font-license">__FONT_LICENSE__</script><main id="game" aria-label="Timber Strike game">
<canvas id="field" role="img" aria-label="A spinning log. Tap the playfield or press Space to throw your weapon."></canvas>

<div id="hint" class="throw-hint" hidden>Tap anywhere to throw</div>
